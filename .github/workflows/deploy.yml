name: CI / Deploy

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/var/www/book-karoo' }}
  # The API runs as one container (not compose), started with
  # backend/.env; nginx serves the web app from frontend/dist.
  API_CONTAINER: book-karoo-backend
  API_IMAGE: book-karoo-backend
  API_PORT: "5022"

jobs:

  # ==========================================
  # CI: build the web app and the API image
  # Runs on GitHub-hosted runners
  # ==========================================

  web:
    name: Build web app
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  api:
    name: Build API image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t book-karoo-backend-ci backend


  # ==========================================
  # DEPLOY: Production server
  # Runs on the self-hosted runner on the production server
  # ==========================================

  deploy:
    name: Deploy to production

    needs:
      - web
      - api

    # Never deploy PR validation runs.
    # Deploy only master branch pushes or manual runs
    # started against master.

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master'

    runs-on:
      - self-hosted
      - Linux
      - X64
      - brd
      - local-server

    environment: production

    concurrency:
      group: deploy-book-karoo
      cancel-in-progress: false

    steps:

      # ------------------------------------------
      # 1. Verify server configuration
      # ------------------------------------------

      - name: Check server prerequisites
        run: |
          set -euo pipefail

          echo "Deployment directory: $DEPLOY_DIR"
          echo "Runner user: $(whoami)"

          node -v
          npm -v
          git --version
          docker --version

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "::error::Deployment directory is not a Git repository"
            exit 1
          fi

          for f in backend/.env frontend/.env; do
            if [ ! -f "$DEPLOY_DIR/$f" ]; then
              echo "::error::Missing $DEPLOY_DIR/$f"
              exit 1
            fi
          done

          echo "Server prerequisites verified."


      # ------------------------------------------
      # 2. Update deployment directory
      # ------------------------------------------

      - name: Pull latest master code
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$DEPLOY_DIR"

          echo "Fetching latest master..."

          # Retried: a short network outage between this server and GitHub
          # once failed a deploy here (git exit code 128).
          for attempt in 1 2 3 4 5; do
            if git fetch origin master; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::git fetch failed 5 times"
              exit 1
            fi
            echo "git fetch failed (attempt $attempt of 5); retrying in $((attempt * 10)) s..."
            sleep $((attempt * 10))
          done

          # Force deployment clone onto remote master.
          # This discards local tracked changes. Untracked and
          # ignored files (.env files, uploads) are kept.

          git checkout -f -B master origin/master

          git reset --hard origin/master

          echo "-----------------------------------"
          echo "Deployment branch: $(git branch --show-current)"
          echo "Deployed commit: $(git rev-parse HEAD)"
          echo "Triggered commit: $GITHUB_SHA"
          echo "-----------------------------------"

          git status --short


      # ------------------------------------------
      # 3. Build web app
      # ------------------------------------------

      - name: Build web app
        working-directory: ${{ env.DEPLOY_DIR }}/frontend
        run: |
          set -euo pipefail

          npm ci

          npm run build

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html was not generated"
            exit 1
          fi


      # ------------------------------------------
      # 4. Build API image
      # ------------------------------------------

      # The running container keeps serving while this builds; if the
      # build fails, nothing is replaced.
      - name: Build API image
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail

          docker build -t "$API_IMAGE" backend


      # ------------------------------------------
      # 5. Recreate API container
      # ------------------------------------------

      - name: Recreate API container
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail

          # Same name, port, image and variables (backend/.env) as the
          # container it replaces; unless-stopped so it survives a reboot.
          docker rm -f "$API_CONTAINER" || true

          docker run -d \
            --name "$API_CONTAINER" \
            --restart unless-stopped \
            -p "$API_PORT:5000" \
            --env-file backend/.env \
            "$API_IMAGE"

          docker ps --filter "name=$API_CONTAINER"


      # ------------------------------------------
      # 6. Verify health
      # ------------------------------------------

      - name: Health check
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail

          # url|mode: "ok" needs a status below 400; "up" accepts anything
          # below 500 (the app answers, it just has no health route there).
          for check in "http://127.0.0.1:5022/health|ok"; do
            url=${check%|*}
            mode=${check#*|}
            echo "Checking $url ($mode)..."

            for i in $(seq 1 30); do
              code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "$url" || true)
              limit=400
              [ "$mode" = up ] && limit=500
              if [ "$code" -ge 200 ] && [ "$code" -lt "$limit" ]; then
                echo "$url answered $code."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "::error::$url did not become healthy (last status $code)"
                docker logs --tail=60 "$API_CONTAINER"
                exit 1
              fi

              sleep 5
            done
          done


      # ------------------------------------------
      # 7. Remove dangling images
      # ------------------------------------------

      # Only untagged images no container uses (the ones this build replaced).
      - name: Remove dangling images
        run: docker image prune -f


      # ------------------------------------------
      # 8. Deployment summary
      # ------------------------------------------

      - name: Deployment summary
        if: success()
        run: |
          echo "=================================="
          echo "BOOK KAROO DEPLOYMENT SUCCESSFUL"
          echo "=================================="
          echo "Commit: $(git -C "$DEPLOY_DIR" rev-parse HEAD)"
          echo "Branch: master"
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "=================================="
